name: WSFU Continuous Integration & Quality Gate

on:
  push:
    branches: [main, master, develop, staging]
  pull_request:
    branches: [main, master, develop, staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. Backend Automated Testing & Security Suite
  # ---------------------------------------------------------------------------
  backend-tests:
    name: 🐍 Backend Tests (Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Test Suite
        env:
          SUPABASE_URL: https://mock-ci-project.supabase.co
          SUPABASE_ANON_KEY: mock-ci-anon-key
          SUPABASE_SERVICE_ROLE_KEY: mock-ci-service-role-key
          GEMINI_API_KEY: mock-ci-gemini-key
          ENVIRONMENT: test
          PYTHONPATH: .
        run: |
          pytest tests/ -v --tb=short

  # ---------------------------------------------------------------------------
  # 2. Web Frontend Build & Typecheck (Vite + TypeScript + PWA)
  # ---------------------------------------------------------------------------
  web-frontend-build:
    name: ⚛️ Web Frontend (TypeScript & PWA Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./web/package.json

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build Web Production Bundle
        env:
          VITE_SUPABASE_URL: https://mock-ci-project.supabase.co
          VITE_SUPABASE_ANON_KEY: mock-ci-anon-key
          VITE_API_URL: https://api.wsfu.ng
        run: npm run build

  # ---------------------------------------------------------------------------
  # 3. Mobile App Typecheck (React Native / Expo)
  # ---------------------------------------------------------------------------
  mobile-typecheck:
    name: 📱 Mobile App (TypeScript Check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./mobile/package.json

      - name: Install Mobile Dependencies
        run: npm install

      - name: Run TypeScript Typecheck
        run: npx tsc --noEmit


  # ---------------------------------------------------------------------------
  # 4. Production Docker Container Build Test
  # ---------------------------------------------------------------------------
  docker-build-check:
    name: 🐳 Production Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Web Production Container
        uses: docker/build-push-action@v5
        with:
          context: ./web
          file: ./web/Dockerfile
          push: false
          tags: wsfu-web:ci-test
